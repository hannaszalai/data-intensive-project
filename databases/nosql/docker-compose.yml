services:

  # ---------------------------------------------------------------------------
  # MongoDB Primary Node
  # Handles all write operations. Part of replica set rs0.
  # Port 27017 exposed to host so init_nosql_data.py and the backend can connect.
  # ---------------------------------------------------------------------------
  mongo-primary:
    image: mongo:7.0
    container_name: mongo-primary
    hostname: mongo-primary
    ports:
      - "27017:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-primary-data:/data/db
    networks:
      - foodgo-network
    environment:
      MONGO_INITDB_DATABASE: foodgo_nosql
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MongoDB Secondary Node
  # Handles read-scaled queries (ReadPreference.SECONDARY_PREFERRED).
  # Port 27018 on the host maps to the standard 27017 inside the container.
  # ---------------------------------------------------------------------------
  mongo-secondary:
    image: mongo:7.0
    container_name: mongo-secondary
    hostname: mongo-secondary
    ports:
      - "27018:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-secondary-data:/data/db
    networks:
      - foodgo-network
    depends_on:
      - mongo-primary
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MongoDB Replica Set Initializer
  # Runs once after both nodes are up, initialises rs0 so the replica set is
  # ready to use without any manual step.
  # restart: no ensures it does not keep re-running after success.
  # ---------------------------------------------------------------------------
  mongo-init:
    image: mongo:7.0
    container_name: mongo-init
    depends_on:
      - mongo-primary
      - mongo-secondary
    networks:
      - foodgo-network
    restart: "no"
    entrypoint: >
      bash -c "
        echo 'Waiting 10 seconds for MongoDB nodes to start...';
        sleep 10;
        echo 'Initiating replica set rs0...';
        mongosh --host mongo-primary:27017 --eval '
          rs.initiate({
            _id: \"rs0\",
            members: [
              { _id: 0, host: \"mongo-primary:27017\", priority: 2 },
              { _id: 1, host: \"mongo-secondary:27017\", priority: 1 }
            ]
          })
        ';
        echo 'Waiting 5 seconds for election to complete...';
        sleep 5;
        echo 'Replica set status:';
        mongosh --host mongo-primary:27017 --eval 'rs.status()';
        echo 'Replica set initialisation complete.';
      "

  # ---------------------------------------------------------------------------
  # Redis Cache
  # Used for:
  #   - Region-aware restaurant menu caches  (cache:menu:{RegionID}:{RestaurantID})
  #   - Active customer shopping carts       (cart:{CustomerID})
  #   - User session tokens                  (session:{UserID})
  #   - Distributed locks via SET NX PX     (lock:{resource})
  # maxmemory-policy allkeys-lru evicts the least-recently-used key when full.
  # ---------------------------------------------------------------------------
  redis-cache:
    image: redis:7.2-alpine
    container_name: redis-cache
    hostname: redis-cache
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - foodgo-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Apache Kafka (KRaft mode - no ZooKeeper required)
  # Topics created by init_nosql_data.py:
  #   - driver-locations      (3 partitions, keyed by DriverID)
  #   - order-status-events   (3 partitions, keyed by OrderID)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - foodgo-network
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  foodgo-network:
    driver: bridge

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  mongo-primary-data:
    driver: local
  mongo-secondary-data:
    driver: local
  redis-data:
    driver: local
  kafka-data:
    driver: local
